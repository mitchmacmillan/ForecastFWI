<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
	    <meta name="viewport" content="width=device-width, initial-scale=1">
    
        <!-- Leaflet CSS -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>

        <!-- Leaflet JavaScript -->
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

        <!-- D3 for interpolate color scheme -->
        <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

    <style>
        /* Make the webmap full screen */
		#map {position: absolute; top: 0; bottom: 0; left: 0; right: 0;}
    </style>

        <title>ForecastFWI</title>

    </head>

    <body>
        <div id="map"></div>
        <script>
            var map = L.map('map').setView([46.501, -63.147], 9);

            // Use OpenStreetMap tiles for the basemap
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                minZoom: 8,  // Out
	        maxZoom: 11, // In
		attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
	    }).addTo(map);

            // Add scale bar
            L.control.scale({
                metric: true,
                imperial: false,
                position: "bottomleft"
            }).addTo(map);

            // Create symbology styles
            function categorizedStyle(feature) {
                const v = feature.properties.value;
                let color;

                if (v < 6) color = "#2c7bb6";
                else if (v < 16) color = "#ffff97";
                else if (v < 23) color = "#ffd063";
                else if (v < 30) color = "#E38D01";
                else color = "#C7191C";

                return {
                    fillColor: color,
                    fillOpacity: 0.8,
                    weight: 0
                };
            }

            function continuousStyle(feature) {
                const v = feature.properties.value;
                const t = Math.max(0, Math.min(1, v / 50));

                return {
                    fillColor: d3.interpolateRdYlGn(1 - t),
                    fillOpacity: 0.8,
                    weight: 0
                };
            }
         
            fetch("https://raw.githubusercontent.com/mitchmacmillan/ForecastFWI/refs/heads/main/FWI_PEI_Polygon.geojson")
                .then(response => response.json())
                .then(data => {

                    console.log("Feature properties:", feature.properties);
					
					function popup(feature, layer) {
                        layer.bindPopup(
                            "Predicted FWI Value: " + 
                            feature.properties.value.toFixed(2)
                        );
                    }

                    const categorized = L.geoJSON(data, {
                        style: categorizedStyle,
                        onEachFeature: popup
                    });

                    const continuous = L.geoJSON(data, {
                        style: continuousStyle,
                        onEachFeature: popup
                    });

                    const baseMaps = {
                        "Categorized": categorized,
                        "Continuous": continuous
                    };

                    categorized.addTo(map);

                    const layerControl = L.control.layers(
                        baseMaps,
                        null,
                        {collapsed: false}
                    ).addTo(map);

                    // Add title
                    const title = document.createElement("div");
                    title.innerHTML = "<strong>FWI Symbology</strong>";
                    title.style.padding = "6px 10px 4px 10px";

                    layerControl.getContainer().insertBefore(
                        title,
                        layerControl.getContainer().firstChild
                    );    

                })
                .catch(err => console.error(err));            
        </script>        
    </body>
</html>
